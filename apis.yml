aid: federal-mediation-and-conciliation-service
name: Federal Mediation and Conciliation Service
description: >-
  The Federal Mediation and Conciliation Service (FMCS) is an independent United States federal agency
  created by the Taft-Hartley Act of 1947 to prevent, minimize and resolve work stoppages and labor
  disputes. It provides collective bargaining mediation, grievance and workplace mediation, arbitrator
  panel referral, facilitation, dispute-resolution systems design, regulatory negotiations and labor-
  management partnership services across seventeen published service lines. FMCS also administers the
  statutory F-7 notice under 29 U.S.C. 158(d) and publishes those notices monthly as Excel workbooks.
  FMCS publishes no developer programme and no specification of its own; its public website runs on
  WordPress and serves an anonymous, read-only REST API at https://www.fmcs.gov/wp-json over the
  agency's pages, document library, neutrals directory, training events and service taxonomy, which is
  catalogued here.
