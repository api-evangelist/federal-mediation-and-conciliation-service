apis:
  - aid: federal-mediation-and-conciliation-service:fmcs-public-content-api
    name: FMCS Public Content API
    description: >-
      The anonymous, read-only WordPress REST API behind www.fmcs.gov. Serves the agency's 117 programme
      and services pages, its 1,122-item document library (where the monthly F-7 collective bargaining
      notice workbooks, FOIA logs and annual reports, arbitrator per-diem rate sheets and financial audit
      reports actually live), its posts and historical timeline, its published neutrals directory, its
      training events, and the seventeen-term taxonomy that enumerates FMCS's service lines. DERIVED
      description — FMCS publishes no specification; the OpenAPI here was derived from the live route
      discovery document at https://www.fmcs.gov/wp-json/ and all 31 operations were confirmed HTTP 200
      anonymously on 2026-09-09. Content only — this is not a case-management, arbitration or F-7 filing
      API; those systems are login-gated and publish no contract.
