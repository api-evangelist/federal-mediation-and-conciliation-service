      type: http
      scheme: basic
      authorization_endpoint: https://www.fmcs.gov/wp-admin/authorize-application.php
      note: >-
        Declared verbatim in the route discovery document under `authentication`. This is a WordPress
        site-administrator mechanism, not a developer credential FMCS issues to the public.
    - name: Cookie + X-WP-Nonce
      type: apiKey
      in: header
      parameter: X-WP-Nonce
      note: Advertised in Access-Control-Allow-Headers on every response.
