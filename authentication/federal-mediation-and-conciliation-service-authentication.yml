gated_surface:
  note: >-
    The same host advertises an authenticated write and administrative surface that is NOT part of the public
    API and is not modelled in the OpenAPI. The route index declares WordPress Application Passwords as the
    site's authentication mechanism, and anonymous callers are refused on every administrative route.
  schemes_advertised_by_platform:
