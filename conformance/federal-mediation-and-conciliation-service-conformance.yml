domain_standards:
  note: >-
    Labour dispute resolution has no machine-readable interchange standard the way healthcare has FHIR or
    banking has ISO 20022. The nearest thing to a domain schema FMCS owns is the F-7 collective bargaining
    notice — a statutory filing under 29 U.S.C. 158(d) with a fixed, documented column layout — and it is
    published as monthly Excel workbooks with a separate file-layout document, not as a schema. REWARD-ONLY:
    no domain standard exists for this market, so nothing is deducted; the entry below records the shape
    that DOES exist so a future pass can tell whether FMCS ever schematises it.
  standards:
    - id: fmcs-f7-notice
      name: Notice to FMCS of Upcoming Collective Bargaining (Form F-7)
      authored_by_this_provider: true
      machine_readable: false
      conforms: false
      evidence: >-
        Published monthly as .xlsx workbooks under /wp-content/uploads/ with a prose file-layout document.
        No JSON Schema, no XSD, no CSV schema, no API. The workbooks are reachable through the media
        collection of the catalogued API (listMedia), but only as binary attachments.
      references:
        - {url: 'https://www.fmcs.gov/resources/documents-and-data/', status: 200}
        - {url: 'https://www.fmcs.gov/wp-content/uploads/2026/08/July-2026-F7-Notices.xlsx', note: 'most recent workbook linked at time of harvest'}
compliance_program:
  published: false
  certifications: []
  trust_center: null
  note: >-
    FMCS publishes no trust centre, no certification list and no compliance programme page — it is a small
    independent federal agency, not a vendor, and is governed by statute and OMB/CISA directives rather than
    by third-party audit certificates. Probed trust.fmcs.gov and security.fmcs.gov (no DNS) and the site
    navigation. No Compliance or TrustCenter pointer is wired, because no such published programme exists.
