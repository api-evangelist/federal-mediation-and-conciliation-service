  - id: rfc8288-web-linking
    conforms: true
    evidence: 'Link header carries rel="next" on paginated collections (observed on /wp/v2/posts?per_page=1).'
  - id: oembed-1.0
    conforms: true
    evidence: 'The oembed/1.0 namespace is registered in the route index and /oembed/1.0/embed returns an oEmbed 1.0 document (200, verified 2026-09-09).'
  - id: hal-style-hypermedia
    conforms: true
    evidence: >-
      Every record carries a _links object with self/collection/about/author/wp:term/curies, and on this
      host the link values use the working /wp-json/ base, so the surface is followable from the root.
  - id: rfc9457-problem-details
    conforms: false
    evidence: 'Errors are application/json in the WordPress envelope {code, message, data.status}; no application/problem+json is served.'
  - id: rfc6750-bearer
    conforms: false
    evidence: No bearer scheme on the public surface; the platform advertises HTTP Basic application passwords for administrators only.
