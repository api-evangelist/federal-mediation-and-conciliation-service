publication_cadence:
  f7_notices:
    frequency: monthly
    format: xlsx
    location: 'https://www.fmcs.gov/resources/documents-and-data/'
    coverage_observed: 'FY2018 through July 2026'
    note: >-
      The agency's flagship dataset. Statutory collective bargaining notices under 29 U.S.C. 158(d),
      published as one Excel workbook per month with a separate file-layout document. There is no API, no
      CSV, no JSON and no bulk endpoint — the workbooks are wp-content uploads, individually addressable
      through the catalogued media collection but not queryable.
  foia_reports:
    frequency: quarterly and annual
    formats: [pdf, xml, csv, xlsx]
    note: 'The FOIA annual reports are the only FMCS publications that ship a machine-readable XML and CSV twin alongside the PDF.'
