    frequency: 'roughly quarterly'
    format: pdf
    note: Arbitrator per-diem rate sheets.
gated_systems:
  note: >-
    FMCS's transactional surfaces are login-gated applications on separate hosts with no public contract.
    They are recorded here because their absence, not their presence, is the finding.
  systems:
    - name: FMCS Arbitration System
      url: https://arbitration.fmcs.gov/
      status: 200
      landing: https://arbitration.fmcs.gov/login.aspx
      platform: 'ASP.NET WebForms'
      contract: none
      probes:
        - {url: 'https://arbitration.fmcs.gov/swagger/v1/swagger.json', status: 404}
        - {url: 'https://arbitration.fmcs.gov/openapi.json', status: 404}
        - {url: 'https://arbitration.fmcs.gov/api/', status: 404}
        - {url: 'https://arbitration.fmcs.gov/Service.asmx?wsdl', status: 200, note: 'HTTP 200 but the body is the application''s themed ASP.NET error page, not a WSDL; a control request to a service name that cannot exist returns the identical 1,245-byte body. Not a SOAP contract.'}
        - {url: 'https://arbitration.fmcs.gov/service.svc?wsdl', status: 404}
    - name: F-7 online notice filing
      url: https://www.fmcs.gov/resources/documents-and-data/filing_an_f-7_online/
      status: 200
      contract: none
      note: >-
        Since 5 April 2022 FMCS accepts F-7 notices ONLY through the online portal — paper, fax, mail and
        email were withdrawn. That makes the filing path digital-only and still API-less: a party with
        hundreds of agreements has no programmatic way to file, and no machine-readable receipt.
