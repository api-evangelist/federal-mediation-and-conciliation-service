notes:
  - >-
    NOTABLE ABSENCE — security.txt. CISA Binding Operational Directive 20-01 directs federal civilian
    executive branch agencies to publish a vulnerability disclosure policy and to make it discoverable at
    /.well-known/security.txt. FMCS has done the harder half and skipped the easy half: it publishes a full
    VDP at https://www.fmcs.gov/vulnerability-disclosure-policy/ (HTTP 200, naming security@fmcs.gov and a
    90-day coordinated-disclosure window) but serves no security.txt pointing at it. A machine looking for
    the policy at the standard location finds nothing. This is a one-file fix on the provider's side.
  - >-
    arbitration.fmcs.gov is an ASP.NET WebForms application that answers unknown paths with a 1,245-byte
    error page. /Service.asmx?wsdl returns HTTP 200 but the body is that same ASP.NET error page, not a
    WSDL — a control request to a service name that cannot exist returns the identical 200. No SOAP
    contract is published; see the wsdl note in lifecycle/.
